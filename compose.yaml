services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: website-app-1
        restart: unless-stopped
        ports:
            - '8000:80'
        environment:
            APP_ENV: dev
            APP_DEBUG: '1'
            APP_SECRET: ${APP_SECRET:-ae228b24e58c4849819c2b9e859a2c6f5ff51990de664ae8ac19dd286751c5ef}
            DATABASE_URL: mysql://solar:${DB_PASSWORD:-914a790dfde349a0bfe09fa683553d75}@database:3306/solar_db?charset=utf8mb4
        volumes:
            - ./:/var/www/html
        depends_on:
            database:
                condition: service_healthy

    database:
        image: mysql:8.0
        restart: unless-stopped
        command: ['--log-bin-trust-function-creators=1']
        environment:
            MYSQL_DATABASE: solar_db
            MYSQL_USER: solar
            MYSQL_PASSWORD: ${DB_PASSWORD:-solar_local}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-solar_local_root}
        volumes:
            - mysql_data:/var/lib/mysql
        ports:
            - '127.0.0.1:3307:3306'
        healthcheck:
            test: ['CMD-SHELL', 'mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
            interval: 5s
            timeout: 3s
            retries: 30

    phpmyadmin:
        image: phpmyadmin:5.2.3
        restart: unless-stopped
        depends_on:
            database:
                condition: service_healthy
        environment:
            PMA_HOST: database
            PMA_PORT: '3306'
        ports:
            - '127.0.0.1:8081:80'

volumes:
    mysql_data:
